<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend2Line</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e4e3de;--go:#1f7a4d;--cond:#b26b00;--no:#b42318;--acc:#3b5bdb;--chip:#f0efe9}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--card:#1c1c1a;--ink:#ecebe6;--mute:#a3a29b;--line:#2e2d2a;--chip:#26251f}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1{margin:0;font-size:20px}header p{margin:0;color:var(--mute)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
form{display:grid;grid-template-columns:1.6fr 1.3fr 1.5fr 1fr 1.3fr;gap:10px;align-items:end}
@media(max-width:760px){form{grid-template-columns:1fr}}
label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px;min-width:0}
form>*{min-width:0}input:not([type=checkbox]),select{width:100%;min-width:0;text-overflow:ellipsis}
input,select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{background:var(--acc);color:#fff;border:0;cursor:pointer;font-weight:600}button:disabled{opacity:.6}
.full{grid-column:1/-1}.banner{padding:8px 12px;border-radius:8px;background:#fff4e5;color:#7a4b00;margin-bottom:12px;font-size:14px}
@media (prefers-color-scheme:dark){.banner{background:#3a2a10;color:#f3c77a}}
.verdict{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.big{font-size:30px;font-weight:800}
.GO{color:var(--go)}.CONDITIONAL{color:var(--cond)}.NO-GO{color:var(--no)}
.kpi{display:flex;flex-direction:column}.kpi b{font-size:20px}.kpi span{font-size:12px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--chip);margin:2px;font-size:13px}
.add{background:#e6f4ea;color:#14532d}.alg{background:#fde8e8;color:#7f1d1d}
@media (prefers-color-scheme:dark){.add{background:#16351f;color:#a7e3b9}.alg{background:#3d1717;color:#f3b0b0}}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.wrap{overflow-x:auto}.bad{color:var(--no);font-weight:600}.ok{color:var(--go)}
.gantt{position:relative}.row{display:flex;align-items:center;gap:8px;margin:4px 0}.row .name{width:190px;font-size:13px;flex:none}
.track{flex:1;position:relative;height:16px;background:var(--chip);border-radius:4px}.bar{position:absolute;height:16px;border-radius:4px;background:#9aa7d8}.bar.crit{background:var(--acc)}
.claim{padding:8px 0;border-bottom:1px solid var(--line)}.st{font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;margin-right:6px}
.st.verified{background:#e6f4ea;color:#14532d}.st.failed{background:#fde8e8;color:#7f1d1d}.st.assumption{background:#fff4e5;color:#7a4b00}
.mute{color:var(--mute);font-size:13px}svg{width:100%;height:auto}
.st.verified_official{background:#e6f4ea;color:#14532d}.st.verified_secondary{background:#e8eefc;color:#1e3a8a}.st.needs_review{background:#fff4e5;color:#7a4b00}
.st.real_open_data,.st.real_public_record{background:#e6f4ea;color:#14532d}.st.public_pack_data_inferred_lines{background:#fff4e5;color:#7a4b00}.st.researched_regulation{background:#e8eefc;color:#1e3a8a}.st.sample_company_input,.st.company_input,.st.uploaded_company_input{background:#f0efe9;color:#4a4a45}
.st.synthetic,.st.placeholder,.st.mock_llm,.st.mock_fallback{background:#fde8e8;color:#7f1d1d}.st.gemini{background:#e8eefc;color:#1e3a8a}
@media (prefers-color-scheme:dark){.st.verified_secondary,.st.researched_regulation,.st.gemini{background:#1b2a4d;color:#b9c8f5}.st.needs_review{background:#3a2a10;color:#f3c77a}}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.small{font-size:13px}a{color:var(--acc)}
tr.target td{background:var(--chip)}
.track{overflow:visible}.deadline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--no)}
.deadline-key{display:inline-block;width:2px;height:12px;background:var(--no);vertical-align:middle;margin-right:4px}
.deadline-kpi b{color:var(--no)}
.svc{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--chip);margin-right:4px}.svc.on{background:#e6f4ea;color:#14532d}.svc.off{opacity:.65}
@media (prefers-color-scheme:dark){.svc.on{background:#14321f;color:#b7e4c7}}
.chipbtn{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;margin:3px;color:var(--fg);font:inherit}
.st.ai_discovered{background:#ede9fe;color:#4c1d95}.st.curated{background:#e6f4ea;color:#14532d}td.num{text-align:right;font-variant-numeric:tabular-nums}td.d,span.d{white-space:nowrap}
</style>
</head>
<body>
<header><h1>Trend2Line</h1><p>From viral trend to a verified factory decision.</p></header>
<main>
  <div id="mode"></div>
    <div id="services" class="row2 small" style="margin:6px 0 10px"></div>
    <div class="card" id="radar"><div class="row2"><h2 style="margin:0">Trend radar</h2>
      <span class="mute small">Rising Google searches in each market (BigQuery public Google Trends data), filtered to food by Gemini.</span>
      <button type="button" id="radarBtn" style="margin-left:auto;width:auto;padding:6px 12px">Scan last 14 days</button></div>
      <div id="radarOut" class="small" style="margin-top:8px"></div></div>
  <div class="card">
    <form id="f">
      <label>Trend name<input name="trend" id="trend" list="demos" placeholder="Any food trend, e.g. Croffle" required></label>
      <datalist id="demos"></datalist>
      <label>Company<select name="company" id="company"></select></label>
      <label>Compare against product<select name="sku_id" id="sku"></select></label>
      <label>Run as of<input type="date" name="as_of" id="as_of" required></label>
      <label>Target market<select name="market" id="market"></select></label>
      <label>Product photo (optional)<input type="file" name="image" accept="image/jpeg,image/png,image/webp"></label>
      <label>Your plant file (optional, YAML)<input type="file" name="plant_file" id="plant_file" accept=".yaml,.yml,text/yaml"></label>
      <label class="row2 small" style="flex-direction:row"><input type="checkbox" name="scan" value="true" checked> Scan all markets</label>
      <div class="small mute" style="align-self:center"><a href="/api/plant/template">Download the plant template</a> · <a href="/api/provenance" target="_blank" rel="noopener">Data sources</a></div>
      <button class="full" id="go">Run analysis</button>
    </form>
  </div>
  <div id="out"></div>
    <div class="card" id="history"><div class="row2"><h2 style="margin:0">Recent decisions</h2><span class="mute small" id="histStore"></span>
      <button type="button" id="histBtn" style="margin-left:auto;width:auto;padding:6px 12px">Refresh</button></div><div id="histOut" class="small" style="margin-top:8px"></div></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = x => x == null ? "–" : Math.round(x * 100) + "%";
const tag = a => esc(String(a).replace(/^[a-z]{2}:/, "").replace(/-/g, " "));
const link = (url, text) => /^https?:\/\//.test(url || "") ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);
const big = n => n == null ? "–" : n >= 1e9 ? (n / 1e9).toFixed(2) + " bn" : n >= 1e6 ? (n / 1e6).toFixed(1) + " m" : Math.round(n).toLocaleString();
const chip = (cls, text) => `<span class="st ${esc(cls)}">${esc(text ?? cls).replace(/_/g, " ")}</span>`;
let CFG = null;

function fillSkus(skus) {
  $("#sku").innerHTML = Object.entries(skus).map(([k, v]) => `<option value="${esc(k)}">${esc(v)}</option>`).join("");
}

fetch("/api/config").then(r => r.json()).then(c => {
  CFG = c;
  $("#company").innerHTML = Object.entries(c.companies).map(([k, v]) =>
    `<option value="${esc(k)}">${esc(v.name)}${v.products ? " · " + v.products + " real products" : ""}</option>`).join("");
  fillSkus(c.skus);
  $("#market").innerHTML = Object.entries(c.markets).map(([k, v]) =>
    `<option value="${esc(k)}" ${k === c.home_market ? "selected" : ""}>${esc(v.name)}</option>`).join("");
  $("#demos").innerHTML = c.demo_trends.map(d => `<option value="${esc(d.trend)}">${esc(d.origin)}</option>`).join("");
  $("#as_of").value = c.today;
  $("#as_of").max = c.today;
  const notes = [];
  if (c.mode === "offline") notes.push("OFFLINE MODE: trend curves are synthetic test data, not real. Unset OFFLINE for live Wikipedia data.");
  if (c.mode === "mock_llm") notes.push("TEST MODE (MOCK_LLM=1): Gemini answers are canned. Production runs use Gemini on Vertex AI; set GOOGLE_CLOUD_PROJECT (or a key) and GEMINI_MODEL, and MOCK_LLM=0.");
  if (c.reference_status !== "computed") notes.push("Half-life reference is a placeholder; verdicts are capped at CONDITIONAL until it is computed (python -m scripts.build_fad_reference).");
  $("#mode").innerHTML = notes.map(n => `<div class="banner">${esc(n)}</div>`).join("");
  const sv = c.services, on = (ok, label) => `<span class="svc ${ok ? "on" : "off"}">${ok ? "●" : "○"} ${esc(label)}</span>`;
  $("#services").innerHTML = on(sv.gemini.live, `Gemini on ${sv.gemini.platform}${sv.gemini.model ? " · " + sv.gemini.model : ""}`) +
    on(sv.grounding, "Google Search grounding") + on(sv.bigquery, "BigQuery trend radar") +
    on(sv.run_store === "firestore", sv.run_store === "firestore" ? "Firestore history" : `History: ${sv.run_store}`) +
    (sv.project ? `<span class="mute">project ${esc(sv.project)}</span>` : "");
  $("#radarBtn").disabled = !sv.bigquery;
  if (!sv.bigquery) $("#radarOut").innerHTML = `<span class="mute">Needs GOOGLE_CLOUD_PROJECT with BigQuery (on by default on Cloud Run).</span>`;
  loadHistory();
});

$("#radarBtn").addEventListener("click", async () => {
  const b = $("#radarBtn"); b.disabled = true; b.textContent = "Querying BigQuery…";
  try {
    const r = await fetch("/api/radar?days=14"), j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    if (!j.food_trends.length) { $("#radarOut").innerHTML = `<span class="mute">No food trends among ${j.terms_scanned} rising searches.</span>`; return; }
    $("#radarOut").innerHTML = j.food_trends.slice(0, 40).map(t =>
      `<button type="button" class="chipbtn" data-trend="${esc(t.english_name)}" data-market="${esc(t.market || "")}"
        title="${esc(t.term)} · +${esc(t.percent_gain)}% · rank ${esc(t.best_rank)} · ${esc(t.last_seen)}">${esc(t.english_name)} <span class="mute">${esc(t.country)} +${esc(t.percent_gain)}%</span></button>`).join("") +
      `<div class="mute">${j.terms_scanned} rising searches in ${j.countries.length} countries · ${esc(j.source)} · click one to analyse it</div>`;
    document.querySelectorAll(".chipbtn").forEach(el => el.addEventListener("click", () => {
      $("#trend").value = el.dataset.trend; if (el.dataset.market) $("#market").value = el.dataset.market;
      $("#as_of").value = CFG.today; $("#trend").scrollIntoView({behavior: "smooth"});
    }));
  } catch (err) { $("#radarOut").innerHTML = `<span class="bad">Radar failed: ${esc(err.message)}</span>`; }
  finally { b.disabled = false; b.textContent = "Scan last 14 days"; }
});

async function loadHistory() {
  try {
    const r = await fetch("/api/runs?limit=10"), j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    $("#histStore").textContent = j.store === "firestore" ? "stored in Firestore" : `stored: ${j.store}`;
    $("#histOut").innerHTML = j.runs.length ? j.runs.map(x => `<div><a href="#" data-run="${esc(x.id)}">${esc(x.created_at)} · ${esc(x.trend)} · ${esc(x.market)} · <b>${esc(x.verdict)}</b></a>
      <span class="mute">${esc(x.company || "")} · ${esc(x.mode)}</span></div>`).join("") : `<span class="mute">No runs yet.</span>`;
    document.querySelectorAll("[data-run]").forEach(a => a.addEventListener("click", async ev => {
      ev.preventDefault();
      const rr = await fetch(`/api/runs/${a.dataset.run}`);
      if (rr.ok) { render(await rr.json()); $("#out").scrollIntoView({behavior: "smooth"}); }
    }));
  } catch (err) { $("#histOut").innerHTML = `<span class="mute">History unavailable: ${esc(err.message)}</span>`; }
}
$("#histBtn").addEventListener("click", loadHistory);

$("#company").addEventListener("change", e => {
  const co = CFG.companies[e.target.value];
  fillSkus(co.skus);
  if (co.home_market && CFG.markets[co.home_market]) $("#market").value = co.home_market;
});

$("#trend").addEventListener("change", e => {
  const d = CFG && CFG.demo_trends.find(x => x.trend.toLowerCase() === e.target.value.toLowerCase());
  if (d) { $("#as_of").value = d.suggested_as_of; $("#market").value = d.suggested_market; }
});

$("#plant_file").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) { fillSkus(CFG.companies[$("#company").value].skus); return; }
  const fd = new FormData(); fd.append("plant_file", f);
  const r = await fetch("/api/plant/validate", {method: "POST", body: fd});
  const j = await r.json();
  if (!r.ok) { $("#out").innerHTML = `<div class="card bad">Plant file rejected: ${esc(j.detail)}</div>`; e.target.value = ""; fillSkus(CFG.skus); return; }
  fillSkus(j.skus);
  $("#out").innerHTML = `<div class="card ok">Loaded ${esc(j.company || "your plant")}: ${Object.keys(j.lines).length} lines, ${Object.keys(j.skus).length} SKUs.</div>`;
});

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#go"); btn.disabled = true; btn.textContent = "Running…";
  $("#out").innerHTML = `<div class="card mute">Reading Wikipedia in each market's languages, resolving ingredients, checking lines, labelling rules and timelines…</div>`;
  try {
    const fd = new FormData(e.target);
    for (const k of ["image", "plant_file"]) if (!fd.get(k) || !fd.get(k).size) fd.delete(k);
    if (!fd.get("scan")) fd.set("scan", "false");
    const r = await fetch("/api/run", {method: "POST", body: fd});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    render(j);
    loadHistory();
  } catch (err) {
    $("#out").innerHTML = `<div class="card bad">Could not finish the analysis: ${esc(err.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = "Run analysis"; }
});

function sparkline(pts, marks) {
  if (!pts || pts.length < 2) return "";
  const w = 600, h = 140, max = Math.max(...pts.map(p => p[1])) || 1;
  const t0 = Date.parse(pts[0][0]), t1 = Date.parse(pts[pts.length - 1][0]);
  const xy = pts.map((p, i) => `${(i / (pts.length - 1)) * w},${h - (p[1] / max) * (h - 10)}`).join(" ");
  const lines = (marks || []).filter(m => { const t = Date.parse(m.date); return t >= t0 && t <= t1; }).map(m => {
    const x = (Date.parse(m.date) - t0) / (t1 - t0) * w;
    return `<line x1="${x}" x2="${x}" y1="0" y2="${h}" stroke="var(--no)" stroke-width="1.5" stroke-dasharray="4 3"><title>${esc(m.brand)} ${esc(m.date)}</title></line>
      <text x="${Math.min(x + 3, w - 60)}" y="12" font-size="11" fill="var(--no)">${esc(m.brand)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Interest over time"><polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${xy}"/>${lines}</svg>
    <div class="mute">${esc(pts[0][0])} to ${esc(pts[pts.length - 1][0])} (weekly, 7-day smoothed daily views)${(marks || []).length ? " · dashed lines: real launches in this market" : ""}</div>`;
}

const POS = {before_takeoff: "before take-off", while_rising: "while rising", after_peak_window_open: "after the peak, window still open",
             after_window_closed: "after the window closed"};

function refLaunches(j, target) {
  const list = j.reference_launches;
  if (!list || !list.length) return "";
  const b = j.time_to_market_benchmark, o = j.trend_origin, W = j.reference_windows || {};
  const mname = m => CFG && CFG.markets[m] ? CFG.markets[m].name : m;
  const timing = r => r.status === "after_run_date" ? "after the run date" : r.status === "no_data" ? "no interest data" :
    r.days_after_takeoff < 0 ? `${-r.days_after_takeoff} days before take-off` :
    `${r.days_after_takeoff} days after take-off<div class="mute small">${esc(POS[r.position] || "")}</div>`;
  return `<div class="card"><h2>Real-world evidence: companies that launched this trend</h2>
    ${o ? `<p class="small">Trend origin: <b>${esc(o.company)}</b> "${esc(o.product)}", ${esc(o.event)} on ${esc(o.date)} · ${link(o.source_url, o.source_title)}</p>` : ""}
    ${b ? `<p><b>Real companies needed ${b.median} days</b> (median of ${b.n}; ${b.p25}–${b.p75}) from take-off in their market to shelf. Fastest: ${esc(b.fastest)}, ${b.fastest_days} days. The verdict uses this when the plant data is not your own${b.source === "ai_discovered" ? " (based on launches found with Google Search, not hand-checked)" : ""}.</p>` : `<p class="mute small">Not enough launches after take-off to measure real time to market for this run date.</p>`}
    <div class="wrap"><table><tr><th>Date</th><th>Company · product</th><th>Market</th><th>Timing</th><th class="num">Interest left</th><th>Source</th></tr>
    ${list.map(r => `<tr class="${r.market === target ? "target" : ""}"><td><span class="d">${esc(r.date)}</span><div class="mute small">${esc(r.date_basis)}</div></td>
      <td><b>${esc(r.brand)}</b> ${esc(r.product)} ${chip(r.verification, r.verification === "ai_discovered" ? "found with Google Search" : "hand-checked")}<div class="mute small">${esc(r.company)}${r.positioning ? " · " + esc(r.positioning) : ""}${r.made_in ? " · made in " + esc(r.made_in) : ""}</div></td>
      <td>${esc(mname(r.market))}</td><td class="small">${timing(r)}</td>
      <td class="num">${r.interest_at_launch_share_of_peak != null ? pct(r.interest_at_launch_share_of_peak) + " of peak" : "–"}</td>
      <td class="small">${r.source_url ? link(r.source_url, r.source_title) : '<span class="mute">see Google sources below</span>'}</td></tr>`).join("")}</table></div>
    ${j.launch_discovery ? `<details class="small" style="margin-top:8px"><summary>Gemini + Google Search: ${j.launch_discovery.rows_returned} launches returned, ${j.launch_discovery.rejected.length} rejected by code checks, ${j.launch_discovery.grounding_sources.length} web sources</summary>
      ${j.launch_discovery.grounding_sources.map(g => `<div>${link(g.uri, g.title || g.domain)}</div>`).join("")}
      ${j.launch_discovery.rejected.map(x => `<div class="mute">Rejected: ${esc(x.row.brand || x.row.company || "?")} (${esc(x.reason)})</div>`).join("")}</details>` : ""}
    ${Object.keys(W).length ? `<h2 style="margin-top:14px">Observed trend window per market</h2><div class="wrap"><table class="small">
      <tr><th>Market</th><th>Read from</th><th>Take-off</th><th>Peak</th><th>Window closed (below 50% of peak)</th><th class="num">Observed half-life</th></tr>
      ${Object.entries(W).map(([m, w]) => `<tr><td>${esc(mname(m))}</td><td>${esc(w.languages_used.join(", "))}</td><td class="d">${esc(w.takeoff_date)}</td><td class="d">${esc(w.peak_date)}</td>
        <td class="d">${esc(w.window_closed_date || "still open")}</td><td class="num">${w.observed_half_life_days == null ? "–" : w.observed_half_life_days + " d"}</td></tr>`).join("")}</table></div>` : ""}
    ${(j.model_check || []).length ? `<p class="small">Model check: ${j.model_check.map(c => `${esc(mname(c.market))} predicted ${c.predicted_median} d (${c.predicted_range.join("–")}), observed ${c.observed} d ${c.within_range ? '<span class="ok">within range</span>' : '<span class="bad">outside range</span>'}`).join("; ")}${j.model_check[0].reference_status !== "computed" ? " (reference still a placeholder)" : ""}.</p>` : ""}
  </div>`;
}

function gantt(route, deadline) {
  const total = Math.max(route.total_days, deadline || 0) || 1;
  const marker = deadline ? `<div class="deadline" style="left:${deadline / total * 100}%" title="Shelf deadline"></div>` : "";
  return `<div class="gantt">${route.tasks.map(t => `<div class="row"><div class="name">${esc(t.task.replace(/_/g, " "))} <span class="mute">${t.duration_days}d</span></div>
    <div class="track"><div class="bar ${t.critical ? "crit" : ""}" style="left:${t.start_day / total * 100}%;width:${Math.max(t.duration_days / total * 100, 0.5)}%"></div>${marker}</div></div>`).join("")}</div>
    ${deadline ? `<p class="mute small"><span class="deadline-key"></span> Shelf deadline: day ${deadline}</p>` : ""}`;
}

function deadlineKpi(dl) {
  if (!dl) return "";
  if (dl.sustained) return `<div class="kpi deadline-kpi"><b>No deadline</b><span>Interest is sustained</span></div>`;
  const g = dl.go_by_days, gd = dl.go_by_date;
  return `<div class="kpi deadline-kpi"><b>On shelf by ${esc(gd.median)}</b>
    <span>Within ${g.median} days to keep ${pct(dl.go_share)} of today's interest (${g.p25}–${g.p75} days across fad speeds; ${dl.conditional_by_days.median} days to keep ${pct(dl.conditional_share)})</span></div>`;
}

function slackLine(d) {
  if (d.slack_days == null) return "";
  const cls = d.slack_days >= 0 ? "ok" : "bad";
  const msg = d.slack_days >= 0 ? `${d.slack_days} days to spare` : `${-d.slack_days} days too late`;
  return `<div class="${cls}" style="flex-basis:100%">The planned route takes ${d.days_to_shelf} days against a ${d.deadline_go_days}-day deadline: ${msg}. The deadline comes from public data only, so check it against your own plant even if the plant data here is a sample.</div>`;
}

function blastRadius(list) {
  if (!list.length) return "";
  const by = {};
  list.forEach(c => { (by[c.sku_id] = by[c.sku_id] || {name: c.sku_name, line: c.line_id, claims: []}).claims.push(`${c.claim_label} (${c.allergens.map(tag).join(", ")})`); });
  return `<div class="card"><h2>Allergen blast radius</h2><p class="mute small">Existing products that would lose a free-from claim if this product ran on their line.</p>
    ${Object.entries(by).map(([id, v]) => `<div class="bad">${esc(v.name)} on ${esc(v.line)}: loses ${v.claims.join("; ")}</div>`).join("")}</div>`;
}

function marketScan(rows, target) {
  if (!rows || !rows.length) return "";
  return `<div class="card"><h2>Market scan</h2>
    <p class="mute small">Ranked with the weights in data/scoring.yaml. Interest comes from each market's own Wikipedia languages; markets read from English share one global signal, so their interest level is not scored.</p>
    <div class="wrap"><table><tr><th>#</th><th>Market</th><th>Interest</th><th>Read from</th><th class="num">People</th><th class="num">GDP / person</th><th>Must declare</th><th>Label languages to add</th><th class="num">Shelf within</th><th class="num">Score</th></tr>
    ${rows.map((r, i) => `<tr class="${r.market === target ? "target" : ""}"><td>${i + 1}</td><td><b>${esc(r.name)}</b><div class="mute small">${chip(r.allergen_source_status)}</div></td>
      <td>${esc(r.signal.stage || "no data")}${r.signal.momentum_90d != null ? `<div class="mute small">momentum ${r.signal.momentum_90d}</div>` : ""}</td>
      <td class="small">${esc((r.signal.languages_used || []).join(", ") || "–")}<div class="mute">${esc((r.signal.basis || "").replace(/_/g, " "))}</div></td>
      <td class="num">${big(r.indicators.population)}</td><td class="num">${r.indicators.gdp_per_capita_usd ? "$" + Math.round(r.indicators.gdp_per_capita_usd).toLocaleString() : "–"}</td>
      <td class="small">${r.mandatory_declarations.map(esc).join(", ") || "none"}${r.place_name_rule ? '<div class="bad">place name in product name</div>' : ""}</td>
      <td class="small">${r.label_languages_needed.map(esc).join(", ") || "none"}</td><td class="num">${r.deadline_go_days == null ? "–" : r.deadline_go_days + " d"}</td><td class="num"><b>${r.score}</b></td></tr>`).join("")}
    </table></div><p class="mute small">Population and GDP: World Bank (${esc((rows[0].indicators.indicator_years || []).join(", "))}).</p></div>`;
}

function compliance(c) {
  const rows = (title, list, cls) => list.length ? `<p><b>${title}</b> ${list.map(d => `<span class="chip ${cls}">${esc(d.label)}${d.effective_from ? " from " + esc(d.effective_from) : ""}</span>`).join("")}</p>` : "";
  return `<div class="card"><h2>Labelling in ${esc(c.market_name)}</h2>
    <p class="small mute">${esc(c.regulator)} · allergen list: ${link(c.allergen_list_source.url, c.allergen_list_source.title)} ${chip(c.allergen_list_source.status)}</p>
    ${rows("Must declare:", c.declarations, "alg")}${rows("Becomes mandatory later:", c.upcoming_declarations, "")}${rows("Recommended:", c.recommended_declarations, "")}
    ${c.allergens_not_regulated_here.length ? `<p class="small">Present but not on this market's list: ${c.allergens_not_regulated_here.map(a => esc(a.label)).join(", ")}. Consider declaring voluntarily.</p>` : ""}
    ${c.triggered_rules.map(r => `<div class="claim"><b>${esc(r.rule_id)}</b> ${chip(r.status)} ${esc(r.requirement)}
      ${r.detail ? `<div class="mute small">Applies because: ${esc(r.detail)}</div>` : ""}<div class="mute small">Source: ${link(r.source_url, r.source_title)}</div></div>`).join("")}</div>`;
}

function ingredients(b) {
  return `<div class="wrap"><table class="small"><tr><th>Ingredient</th><th>Matched to</th><th>Allergens</th></tr>
    ${b.resolved_ingredients.map(r => `<tr><td>${esc(r.name)}</td><td>${r.labels.map(esc).join(", ") || '<span class="bad">not found</span>'} <span class="mute">(${esc(r.match.replace(/_/g, " "))})</span></td>
      <td>${r.allergens.map(a => `<span class="chip alg">${tag(a)}</span>`).join("")}${(r.review_flags || []).map(a => `<span class="chip">check ${tag(a)}</span>`).join("")}</td></tr>`).join("")}
  </table></div><p class="mute small">Resolved with the Open Food Facts ingredient taxonomy (ODbL).</p>`;
}

function render(j) {
  const d = j.decision, v = j.verification, tr = j.trend, b = j.bom, c = j.compliance;
  const chosen = j.routes.find(r => r.route === d.route);
  const caught = j.attempts.length > 1 ? `Verifier rejected ${j.attempts[0].failed} claim(s) on draft 1; final draft ${j.attempts[j.attempts.length - 1].passed ? "passed" : "still failed"}.` : "First draft passed verification.";
  $("#out").innerHTML = `
  <div class="card verdict">
    <div class="big ${esc(d.verdict)}">${esc(d.verdict)}</div>
    ${deadlineKpi(j.shelf_deadline)}
    <div class="kpi"><b>${esc(c.market_name)}</b><span>Target market</span></div>
    <div class="kpi"><b>${esc(d.route.replace(/_/g, " "))}${d.line ? " · " + esc(d.line) : ""}</b><span>Route</span></div>
    <div class="kpi"><b>${chosen.total_days} days</b><span>Time to shelf (${esc(chosen.launch_date)}) · ${esc(d.time_to_shelf_basis)}</span></div>
    <div class="kpi"><b>${pct(d.capture_median)}</b><span>Interest left at launch (range ${pct(chosen.capture.p25)}–${pct(chosen.capture.p75)})</span></div>
    <div class="kpi"><b>${v ? v.trust : "–"}</b><span>Trust score</span></div>
    ${slackLine(d)}
    ${d.faster_line_blocked ? `<div class="bad" style="flex-basis:100%">Line ${esc(d.faster_line_blocked.line)} could reach shelf in ${d.faster_line_blocked.total_days} days, but it would void: ${d.faster_line_blocked.blocked_by.map(esc).join("; ")}.</div>` : ""}
    <div class="mute" style="flex-basis:100%">${esc(caught)}${d.downgrade_reasons.length ? " Caveats: " + d.downgrade_reasons.map(esc).join("; ") + "." : ""}</div>
  </div>
  ${blastRadius(j.allergen_blast_radius)}
  <div class="grid2">
    <div class="card"><h2>Interest · ${esc(tr.article)}</h2>${sparkline(tr.series_weekly, (j.reference_launches || []).filter(r => r.market === c.market))}
      <p>Stage <b>${esc(tr.stage)}</b> · momentum ${tr.momentum_90d} · ${esc(tr.reference_class)} fad</p>
      <p class="small mute">Read from ${esc((tr.languages_used || []).join(", "))} Wikipedia (${esc((tr.basis || "").replace(/_/g, " "))}). Article exists in ${tr.editions_available.length} languages. ${esc(tr.source)}</p></div>
    <div class="card"><h2>Product vs ${esc(b.our_sku)}</h2>
      <p>${esc(j.spec.product_name)} <span class="mute">(${esc(b.format_from)} to ${esc(b.format_to)})</span></p>
      ${ingredients(b)}
      ${b.new_allergens_vs_our_sku.length ? `<p class="small">New allergens vs our SKU: ${b.new_allergens_vs_our_sku.map(a => `<span class="chip alg">${tag(a)}</span>`).join("")}</p>` : ""}</div>
  </div>
  ${refLaunches(j, c.market)}
  ${compliance(c)}
  ${marketScan(j.market_scan, c.market)}
  <div class="card"><h2>Line feasibility</h2><div class="wrap"><table>
    <tr><th>Line</th><th>Gaps (best option)</th><th>New allergens</th><th>Free-from conflicts</th><th class="num">Lead days</th></tr>
    ${j.lines.map(l => `<tr><td><b>${esc(l.line_id)}</b> ${esc(l.line_name)}</td>
      <td>${l.gaps.map(g => esc(g.step.replace(/_/g, " ")) + (g.best_option ? `: ${esc(g.best_option.option)} (${g.best_option.lead_time_days}d)` : `: <span class="bad">no option</span>`)).join("<br>") || '<span class="ok">none</span>'}</td>
      <td>${l.new_allergens_on_line.map(tag).join(", ") || "none"}</td>
      <td>${[...new Set(l.free_from_conflicts.map(x => x.sku_id))].map(x => `<span class="bad">${esc(x)}</span>`).join(", ") || "none"}</td>
      <td class="num">${l.gap_lead_days}</td></tr>`).join("")}
  </table></div></div>
  <div class="card"><h2>Timeline · ${esc(chosen.route.replace("_", " "))} · shelf ${esc(chosen.launch_date)}</h2>${gantt(chosen, j.decision.deadline_go_days)}</div>
  ${j.plan ? `<div class="card"><h2>Recommendation</h2><p><b>${esc(j.plan.headline)}</b></p><p>${esc(j.plan.rationale)}</p>
    <ul>${j.plan.actions.map(a => `<li>${esc(a)}</li>`).join("")}</ul>
    <h2 style="margin-top:14px">Claims and receipts</h2>
    ${v.claims.map(x => `<div class="claim"><span class="st ${esc(x.status)}">${esc(x.status)}</span>${esc(x.text)}
      <div class="mute">${esc(x.kind)} · ${(x.evidence_ids || []).map(esc).join(", ") || esc(x.rule_id || x.line || "–")} · ${esc(x.reason)}</div></div>`).join("")}
    ${v.orphans.map(o => `<div class="claim"><span class="st failed">orphan</span>${esc(o.text)}<div class="mute">${esc(o.reason)}</div></div>`).join("")}</div>` : ""}
  ${j.attempts.filter(a => !a.passed).length ? `<div class="card"><h2>Caught by the verifier</h2>${j.attempts.filter(a => !a.passed).map(a =>
    a.rejected.map(r => `<div class="claim"><span class="st failed">draft ${a.attempt}</span>${esc(r.text)}<div class="mute">${esc(r.reason)}</div></div>`).join("")).join("")}</div>` : ""}
  <div class="card"><h2>Where every input came from</h2><div class="wrap"><table class="small"><tr><th>Input</th><th>Status</th><th>Detail</th></tr>
    ${j.provenance.map(p => `<tr><td>${esc(p.input)}</td><td>${chip(p.status)}</td><td>${esc(p.detail)}</td></tr>`).join("")}</table></div></div>
  <div class="card"><h2>Run log</h2>${j.steps.map(s => `<div class="mute">${s.t}s · <b>${esc(s.step)}</b> (${esc(s.kind)}) ${esc(s.detail)}</div>`).join("")}
    ${j.run_id ? `<div class="mute">Saved as run ${esc(j.run_id)} (${esc(j.run_store)})</div>` : ""}
    <div class="mute">Mode ${esc(j.mode)} · LLM calls ${j.llm_calls} · cache hits ${j.cache_hits} · web requests ${j.http_requests} · ${j.evidence.length} evidence items</div></div>`;
}
</script>
</body>
</html>
