# SAMPLE COMPANY INPUT. No public dataset describes a specific factory's lines, so this file is an
# illustrative multi-category plant. Replace it with your own (or upload one in the UI); the schema mirrors an
# ERP equipment master + SKU master. Line allergens are COMPUTED from the SKU ingredients (Open Food Facts
# taxonomy) plus `extra_allergens` for anything handled on the line that is not in a listed SKU.
company: "Sample Foods Pvt Ltd (illustrative)"
provenance: sample_company_input
home_market: IN
base_label_languages: [en, hi]

lines:
  L2:
    name: Moulding line 2
    category: confectionery
    capabilities: [tempering, solid_moulding, shell_moulding, cooling_tunnel, flow_wrap]
    rate_kg_h: 400
  L3:
    name: One-shot depositing line 3
    category: confectionery
    capabilities: [tempering, one_shot_depositing, cooling_tunnel, flow_wrap]
    rate_kg_h: 300
  L4:
    name: Enrobing line 4
    category: confectionery
    capabilities: [tempering, enrobing, toasting, cooling_tunnel, flow_wrap]
    rate_kg_h: 500
  B1:
    name: Bakery line B1
    category: bakery
    capabilities: [dough_mixer, laminator, proofer, oven, cooling_tunnel, ultrasonic_cutter, flow_wrap]
    rate_kg_h: 600
  D1:
    name: Dairy and beverage line D1
    category: dairy_beverage
    capabilities: [high_shear_mixing, pasteuriser, homogeniser, liquid_filler, cup_filler_sealer, cooking_kettle]
    rate_kg_h: 2000
  S1:
    name: Snacks line S1
    category: snacks
    capabilities: [fryer, extruder, seasoning_drum, vffs]
    rate_kg_h: 350

skus:
  CLASSIC-100:
    name: Classic Milk Chocolate 100 g
    line: L2
    format: solid_bar
    ingredients: [milk chocolate]
    process_steps: [tempering, solid_moulding, cooling, demoulding, wrapping]
    free_from: []
