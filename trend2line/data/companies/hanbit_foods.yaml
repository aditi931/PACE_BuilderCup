# SYNTHETIC DEMO COMPANY. Hanbit Foods is fictional: no real company, plant or product is described.
# It is modelled on a typical Korean bakery-café and confectionery manufacturer (franchise bakery supply,
# convenience-store desserts, candy and frozen snacks) so the demo has a realistic portfolio in a market that
# is read from its own-language (Korean) Wikipedia. Lines and SKUs are invented but plausible; ingredients
# resolve through the real Open Food Facts taxonomy like any uploaded plant file.
