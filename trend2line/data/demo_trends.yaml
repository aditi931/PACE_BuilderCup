# Example trends from different regions and categories. Each suggested_as_of is at least 90 days after the
# market's Wikipedia article has pageviews (otherwise there is no curve to read). Used for the UI picker, offline tests, and as canned
# Gemini output when MOCK_LLM=1. In live mode Gemini produces the product spec for ANY trend typed in.
trends:
  - trend: Dubai chocolate
    origin: United Arab Emirates
    suggested_as_of: 2025-04-15   # en article starts 2024-11-29
    suggested_market: GCC
    spec:
      product_name: Milk chocolate bar with pistachio cream and toasted kataifi
      category: confectionery
      format: shell_and_fill
      hero_ingredient: pistachio
      ingredients:
        - {name: milk chocolate, role: shell, components: [cocoa butter, sugar, milk powder]}
        - {name: pistachio paste, role: filling, components: []}
        - {name: sugar, role: filling, components: []}
        - {name: vegetable fat, role: filling, components: []}
        - {name: milk powder, role: filling, components: []}
        - {name: kataifi, role: inclusion, components: [wheat flour, water]}
        - {name: butter, role: inclusion, components: []}
        - {name: tahini, role: filling, components: []}
      process_steps: [tempering, shell_moulding, toasting, filling_deposit, backing_off, cooling, demoulding, wrapping]
