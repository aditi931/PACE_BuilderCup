      - rule_id: GCC-ARABIC
        trigger: {type: label_language}
        requirement: 'Labelling must be in Arabic; any other language must sit alongside and match the Arabic.'
        source: {title: "GSO 9/2013 clause 7.2.1", url: "https://servicio.mapama.gob.es/cexgan/DocumentacionPublica/GSO-9-2013-E.pdf", status: needs_review}
      - rule_id: GCC-NOT-MISLEADING
        trigger: {type: place_name_in_product_name}
        requirement: 'Food must not be described in a false, misleading or deceptive way; check any place name in the product name.'
        source: {title: "GSO 9/2013 clause 4.2", url: "https://servicio.mapama.gob.es/cexgan/DocumentacionPublica/GSO-9-2013-E.pdf", status: needs_review}

