        source: {title: "ANVISA labelling summary", url: "https://www.boaconta.com.br/rotulagem-nutricional/rotulagem-de-alergenicos/", status: verified_secondary}
      - rule_id: BR-NO-ALLERGEN-FREE-CLAIM
