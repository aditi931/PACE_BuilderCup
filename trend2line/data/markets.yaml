      url: https://servicio.mapama.gob.es/cexgan/DocumentacionPublica/GSO-9-2013-E.pdf
      status: needs_review
      checked_on: 2026-10-15
    allergens:
      - {id: gluten_cereals, label: Cereals containing gluten, allergens: [en:gluten], nodes: [en:wheat, en:rye, en:barley, en:oat, en:spelt]}
      - {id: crustacea, label: Crustacea, allergens: [en:crustaceans]}
      - {id: eggs, label: Eggs, allergens: [en:eggs]}
      - {id: fish, label: Fish, allergens: [en:fish]}
      - {id: peanuts_soy, label: "Peanuts and soybeans", allergens: [en:peanuts, en:soybeans]}
      - {id: tree_nuts, label: "Tree nuts (English text says 'walnuts')", allergens: [en:nuts]}
      - {id: milk, label: "Milk (including lactose)", allergens: [en:milk]}
      - {id: sulphite, label: "Sulphite (10 ppm or more)", allergens: [en:sulphur-dioxide-and-sulphites]}
      - {id: celery, label: Celery, allergens: [en:celery]}
      - {id: mustard, label: Mustard, allergens: [en:mustard]}
      - {id: sesame, label: Sesame seeds, allergens: [en:sesame-seeds]}
      - {id: molluscs, label: "Clams / molluscs", allergens: [en:molluscs]}
      - {id: lupin, label: Lupin, allergens: [en:lupin]}
    rules:
      - rule_id: GCC-ALLERGEN-DECL
        trigger: {type: allergen_declared}
        requirement: 'Declare foods and ingredients that cause hypersensitivity as "contains ...".'
