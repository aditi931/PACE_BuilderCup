    allergens:
      - {id: gluten_cereals, label: "Cereals containing gluten", allergens: [en:gluten], nodes: [en:wheat, en:rye, en:barley, en:oat, en:spelt]}
      - {id: crustaceans, label: Crustaceans, allergens: [en:crustaceans]}
      - {id: eggs, label: Eggs, allergens: [en:eggs]}
      - {id: fish, label: Fish, allergens: [en:fish]}
      - {id: peanuts, label: Peanuts, allergens: [en:peanuts]}
      - {id: soybeans, label: Soybeans, allergens: [en:soybeans]}
      - {id: milk, label: Milk, allergens: [en:milk]}
      - {id: nuts, label: "Nuts (8 named tree nuts)", nodes: *tree_nuts}
      - {id: celery, label: Celery, allergens: [en:celery]}
      - {id: mustard, label: Mustard, allergens: [en:mustard]}
      - {id: sesame, label: Sesame, allergens: [en:sesame-seeds]}
      - {id: sulphites, label: "Sulphur dioxide and sulphites", allergens: [en:sulphur-dioxide-and-sulphites]}
      - {id: lupin, label: Lupin, allergens: [en:lupin]}
      - {id: molluscs, label: Molluscs, allergens: [en:molluscs]}
    rules:
      - rule_id: GB-ALLERGEN-DECL
        trigger: {type: allergen_declared}
