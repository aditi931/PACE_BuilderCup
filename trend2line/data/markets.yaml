        source: {title: "Retained Reg. 1169/2011 Art. 36", url: "https://www.legislation.gov.uk/eur/2011/1169/contents", status: needs_review}

  US:
    name: United States
    regulator: FDA (FALCPA 2004, FASTER Act 2021)
    countries: [US]
    wiki_languages: [en]
    label_languages: [en]
    allergen_source:
      title: 'FDA, Food Allergies (nine major food allergens; sesame since 1 Jan 2023)'
      url: https://www.fda.gov/food/food-labeling-nutrition/food-allergies
      status: verified_official
      checked_on: 2026-10-15
    allergens:
      - {id: milk, label: Milk, allergens: [en:milk]}
      - {id: eggs, label: Eggs, allergens: [en:eggs]}
      - {id: fish, label: "Fish (name the species)", allergens: [en:fish]}
      - {id: crustacean_shellfish, label: "Crustacean shellfish (name the species)", allergens: [en:crustaceans]}
      - {id: tree_nuts, label: "Tree nuts (name the nut)", allergens: [en:nuts], nodes: *tree_nuts}
      - {id: peanuts, label: Peanuts, allergens: [en:peanuts]}
      - {id: wheat, label: Wheat, nodes: [en:wheat, en:spelt]}
      - {id: soybeans, label: Soybeans, allergens: [en:soybeans]}
      - {id: sesame, label: Sesame, allergens: [en:sesame-seeds]}
    rules:
      - rule_id: US-ALLERGEN-DECL
        trigger: {type: allergen_declared}
        requirement: 'Show the food source name of each major allergen, either in parentheses in the ingredient list or in a "Contains" statement.'
        source: {title: "FDA, Food Allergies: What You Need to Know", url: "https://fda.gov/media/164289/download", status: verified_official}
      - rule_id: US-ADVISORY
        trigger: {type: cross_contact_on_line}
        requirement: '"May contain" statements are voluntary, must be truthful and not misleading, and are not a substitute for good manufacturing practice.'
        source: {title: "FDA consumer leaflet on major food allergens", url: "https://fda.gov/media/164289/download", status: verified_official}
      - rule_id: US-FREEFROM-VOID
        trigger: {type: free_from_conflict}
        requirement: 'A free-from claim on a line that now runs the allergen must be withdrawn or revalidated (gluten-free claims are defined in 21 CFR 101.91).'
        source: {title: "21 CFR 101.91 (gluten-free)", url: "https://www.ecfr.gov/current/title-21/chapter-I/subchapter-B/part-101/subpart-F/section-101.91", status: needs_review}

  CA:
    name: Canada
    regulator: Health Canada / CFIA
    countries: [CA]
    wiki_languages: [en, fr]
    label_languages: [en, fr]
    allergen_source:
      title: 'Health Canada, Allergens and gluten sources labelling'
      url: https://www.canada.ca/en/health-canada/services/food-allergies-intolerances/avoiding-allergens-food/allergen-labelling.html
      status: verified_official
      checked_on: 2026-10-15
    allergens:
      - {id: peanuts, label: Peanuts, allergens: [en:peanuts]}
      - {id: tree_nuts, label: "Tree nuts (almond, Brazil, cashew, hazelnut, macadamia, pecan, pine nut, pistachio, walnut)", nodes: [en:almond, en:brazil-nut, en:cashew-nuts, en:hazelnut, en:macadamia-nut, en:pecan-nut, en:pine-nuts, en:pistachio-nuts, en:walnut]}
      - {id: sesame, label: Sesame seeds, allergens: [en:sesame-seeds]}
      - {id: milk, label: Milk, allergens: [en:milk]}
      - {id: eggs, label: Eggs, allergens: [en:eggs]}
      - {id: fish_shellfish, label: "Fish, crustaceans and molluscs", allergens: [en:fish, en:crustaceans, en:molluscs]}
      - {id: soy, label: Soy, allergens: [en:soybeans]}
      - {id: wheat_triticale, label: "Wheat or triticale", nodes: [en:wheat, en:triticale, en:spelt]}
      - {id: mustard, label: Mustard, allergens: [en:mustard]}
      - {id: gluten_sources, label: "Gluten sources (barley, oats, rye, triticale, wheat)", allergens: [en:gluten], nodes: [en:barley, en:oat, en:rye, en:triticale, en:wheat]}
      - {id: sulphites, label: "Added sulphites (10 ppm or more)", allergens: [en:sulphur-dioxide-and-sulphites]}
    rules:
      - rule_id: CA-ALLERGEN-DECL
        trigger: {type: allergen_declared}
        requirement: 'Declare priority allergens, gluten sources and added sulphites in the ingredient list or in a "Contains" statement right after it, using common names.'
        source: {title: "Health Canada, allergen labelling", url: "https://www.canada.ca/en/health-canada/services/food-allergies-intolerances/avoiding-allergens-food/allergen-labelling.html", status: verified_official}
      - rule_id: CA-BILINGUAL
        trigger: {type: label_language}
        requirement: 'Mandatory label information must appear in English and French.'
        source: {title: "Safe Food for Canadians Regulations, bilingual labelling", url: "https://inspection.canada.ca/en/food-labels", status: needs_review}
      - rule_id: CA-FREEFROM-VOID
        trigger: {type: free_from_conflict}
        requirement: 'Labels must not be false or misleading, so a free-from claim must go when the allergen is on the line.'
        source: {title: "Food and Drugs Act s.5", url: "https://inspection.canada.ca/en/food-labels", status: needs_review}

  AU:
