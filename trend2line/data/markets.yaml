      - {id: soy, label: Soy, allergens: [en:soybeans]}
      - {id: sulphites, label: "Sulphites (10 mg/kg or more)", allergens: [en:sulphur-dioxide-and-sulphites]}
      - {id: almond, label: Almond, nodes: [en:almond]}
      - {id: brazil_nut, label: Brazil nut, nodes: [en:brazil-nut]}
      - {id: cashew, label: Cashew, nodes: [en:cashew-nuts]}
      - {id: hazelnut, label: Hazelnut, nodes: [en:hazelnut]}
      - {id: macadamia, label: Macadamia, nodes: [en:macadamia-nut]}
      - {id: pecan, label: Pecan, nodes: [en:pecan-nut]}
      - {id: pine_nut, label: Pine nut, nodes: [en:pine-nuts]}
      - {id: pistachio, label: Pistachio, nodes: [en:pistachio-nuts]}
      - {id: walnut, label: Walnut, nodes: [en:walnut]}
    rules:
      - rule_id: AU-PEAL-DECL
        trigger: {type: allergen_declared}
        requirement: 'Use the PEAL required names (each tree nut by name, not "tree nuts") in the ingredient list and in a bold summary statement starting "Contains".'
        source: {title: "FSANZ Standard 1.2.3 and Schedule 9 (PEAL)", url: "https://www.safefood.qld.gov.au/newsroom/understanding-plain-english-allergen-labelling-peal-for-packaged-food/", status: verified_secondary}
      - rule_id: AU-FREEFROM-VOID
        trigger: {type: free_from_conflict}
        requirement: 'A free-from claim on a shared line must be withdrawn or revalidated.'
        source: {title: "Australian Consumer Law, misleading conduct", url: "https://www.foodstandards.gov.au/", status: needs_review}

